<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess videoapp \
        python-home=/usr/local \
        python-path=/app \
        user=www-data \
        group=www-data \
        processes=2 \
        threads=4

    WSGIProcessGroup videoapp
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/web_service.wsgi

    <Directory /app>
        Require all granted
    </Directory>

    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
